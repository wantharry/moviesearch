<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0" />
<title>Movie Search</title>
<meta name="theme-color" content="#0f1115" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Movie Search" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>🎬 Movie Search</h1>
    <button id="filterToggle" class="filter-toggle" aria-label="Toggle filters">Filters</button>
  </header>

  <div class="layout">
    <div id="filterOverlay" class="filter-overlay"></div>
    <aside class="filters" id="filters">
      <div class="filters-header">
        <span>Filters</span>
        <button id="filterClose" class="filter-close" aria-label="Close filters">&times;</button>
      </div>

      <details class="filter-group" open>
        <summary>Genres <span class="count" id="genreCount"></span></summary>
        <div id="genre-list" class="chip-list"></div>
        <div class="genre-mode">
          <label><input type="radio" name="genreMode" value="any" checked /> Any</label>
          <label><input type="radio" name="genreMode" value="all" /> All</label>
        </div>
      </details>

      <details class="filter-group">
        <summary>Rating &amp; votes <span class="count" id="ratingCount"></span></summary>
        <div class="compact-grid">
          <label class="mini-label">Rating min<input id="minRating" type="number" inputmode="decimal" min="0" max="10" step="0.1" value="6" /></label>
          <label class="mini-label">Rating max<input id="maxRating" type="number" inputmode="decimal" min="0" max="10" step="0.1" value="10" /></label>
          <label class="mini-label">Votes min<input id="minVotes" type="number" inputmode="numeric" min="0" value="3000" placeholder="min" /></label>
          <label class="mini-label">Votes max<input id="maxVotes" type="number" inputmode="numeric" min="0" placeholder="any" /></label>
        </div>
      </details>

      <details class="filter-group">
        <summary>Year &amp; runtime <span class="count" id="yearCount"></span></summary>
        <div class="compact-grid">
          <label class="mini-label">Year min<input id="minYear" type="number" inputmode="numeric" placeholder="min" /></label>
          <label class="mini-label">Year max<input id="maxYear" type="number" inputmode="numeric" placeholder="max" /></label>
          <label class="mini-label">Runtime min<input id="minRuntime" type="number" inputmode="numeric" placeholder="min" /></label>
          <label class="mini-label">Runtime max<input id="maxRuntime" type="number" inputmode="numeric" placeholder="max" /></label>
        </div>
      </details>

      <details class="filter-group">
        <summary>Type &amp; sort</summary>
        <div class="compact-grid two-col">
          <label class="mini-label">Title type<select id="titleTypes" multiple size="4"></select></label>
          <label class="mini-label">Sort by
            <select id="sortBy">
              <option value="votes">Most votes</option>
              <option value="rating">Highest rated</option>
              <option value="year">Newest</option>
            </select>
          </label>
        </div>
      </details>

      <details class="filter-group">
        <summary>Certification <span class="count" id="certCount"></span></summary>
        <div id="cert-list" class="chip-list"></div>
      </details>

      <details class="filter-group">
        <summary>Country <span class="count" id="countryCount"></span></summary>
        <div id="country-list" class="chip-list"></div>
      </details>

      <button id="apply" type="button">Apply Filters</button>
    </aside>

    <main>
      <div id="status" class="status"></div>
      <div id="results" class="grid"></div>
      <button id="loadMore" class="load-more" type="button" hidden>Load 50 more</button>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
